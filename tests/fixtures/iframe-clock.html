<!doctype html>
<html lang="en">
<meta charset="utf-8">
<style>
  body { margin: 12px; font: 16px system-ui; }
  #parent { width: 600px; }
  timenow-zone-sdcw { display: block; }
</style>
<script>
  window.clockErrors = [];
  addEventListener("error", event => window.clockErrors.push(event.message || "Resource loading error"));
</script>
<div id="parent"><timenow-zone-sdcw width="0" time-zone="UTC" locale="en-GB" second="true" font-family="monospace" background-color="#164e63" rounded="0.5"></timenow-zone-sdcw></div>
<script src="/widget.js"></script>
</html>
