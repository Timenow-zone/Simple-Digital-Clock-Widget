name: sdcw-local-review-20261027

x-wordpress: &wordpress
  depends_on:
    db:
      condition: service_healthy
  environment: &wp-environment
    WORDPRESS_DB_HOST: db
    WORDPRESS_DB_USER: root
    WORDPRESS_DB_PASSWORD: ${SDCW_LAB_DB_PASSWORD:?Set the isolated lab password}
    WORDPRESS_DEBUG: "1"
    WORDPRESS_CONFIG_EXTRA: |
      define('WP_DEBUG_LOG', true);
      define('WP_DEBUG_DISPLAY', true);
      define('WP_ENVIRONMENT_TYPE', 'local');
      define('AUTOMATIC_UPDATER_DISABLED', true);
      define('WP_AUTO_UPDATE_CORE', false);
      define('DISABLE_WP_CRON', true);
      define('WP_HTTP_BLOCK_EXTERNAL', true);
  networks: [lab]

services:
  db:
    image: mariadb:11.4.8
    environment:
      MARIADB_ROOT_PASSWORD: ${SDCW_LAB_DB_PASSWORD:?Set the isolated lab password}
    volumes:
      - ../../.local/wordpress-lab/db:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/clock.sql:ro
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [lab]

  wp71:
    <<: *wordpress
    image: wordpress:7.1.3-php8.3-apache
    environment:
      <<: *wp-environment
      WORDPRESS_DB_NAME: wp71
    ports: ["127.0.0.1:19427:80"]
    volumes:
      - ../../.local/wordpress-lab/wp71:/var/www/html
      - ../../.local/wordpress-lab/packages:/lab/packages:ro
      - ../../.local/wordpress-lab/wp-cli.phar:/lab/wp-cli.phar:ro
      - ./:/lab/source:ro

  wp84:
    <<: *wordpress
    image: wordpress:7.1.3-php8.4-apache
    environment:
      <<: *wp-environment
      WORDPRESS_DB_NAME: wp84
    ports: ["127.0.0.1:19428:80"]
    volumes:
      - ../../.local/wordpress-lab/wp84:/var/www/html
      - ../../.local/wordpress-lab/packages:/lab/packages:ro
      - ../../.local/wordpress-lab/wp-cli.phar:/lab/wp-cli.phar:ro
      - ./:/lab/source:ro

  wp63:
    <<: *wordpress
    image: wordpress:6.3-php8.2-apache
    environment:
      <<: *wp-environment
      WORDPRESS_DB_NAME: wp63
    ports: ["127.0.0.1:19429:80"]
    volumes:
      - ../../.local/wordpress-lab/wp63:/var/www/html
      - ../../.local/wordpress-lab/packages:/lab/packages:ro
      - ../../.local/wordpress-lab/wp-cli.phar:/lab/wp-cli.phar:ro
      - ./:/lab/source:ro

  wp68:
    <<: *wordpress
    image: wordpress:6.8-php8.3-apache
    environment:
      <<: *wp-environment
      WORDPRESS_DB_NAME: wp68
    ports: ["127.0.0.1:19430:80"]
    volumes:
      - ../../.local/wordpress-lab/wp68:/var/www/html
      - ../../.local/wordpress-lab/packages:/lab/packages:ro
      - ../../.local/wordpress-lab/wp-cli.phar:/lab/wp-cli.phar:ro
      - ./:/lab/source:ro

networks:
  lab:
    ipam:
      config:
        - subnet: ${SDCW_LAB_SUBNET:-10.254.93.0/24}
